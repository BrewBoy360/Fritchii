# MangoHud config for Fritchii/Lichii benchmarking. Used via MANGOHUD_CONFIGFILE (sandbox-run.sh MH=1).
# Shift_L+F2 records a 30-second CSV log; Shift_R+F12 hides the overlay. The log folder is set by
# sandbox-run.sh through MANGOHUD_CONFIG=output_folder=... (default ./mangohud-logs).

# --- On-screen (small, top-right; Shift_R+F12 hides/shows it) ---
position=top-right
fps
frametime
frame_timing
gpu_stats
cpu_stats
font_size=18
background_alpha=0.4

# --- Logging ---
log_duration=30
autostart_log=0
toggle_logging=Shift_L+F2
log_interval=0
